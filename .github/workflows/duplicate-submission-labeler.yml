name: Duplicate Submission Labeler
on:
  pull_request_target:
    types: [opened, labeled, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to use as duplicate-check trigger
        required: true
        type: number

jobs:
  label-duplicates:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'Submission') || contains(github.event.pull_request.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check and Label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER="${{ inputs.pr_number || github.event.pull_request.number }}"
          USER_LOGIN=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')

          # Find all open submission PRs for same author.
          ALL_USER_PRS=$(gh pr list --state open --author "$USER_LOGIN" --json number,labels --limit 100)

          SUBMISSION_PRS=$(echo "$ALL_USER_PRS" | jq -r '.[] | select(.labels[].name | ascii_downcase == "submission") | .number')

          PR_COUNT=$(echo "$SUBMISSION_PRS" | wc -w)

          if [ "$PR_COUNT" -gt 1 ]; then
            for PR_NUM in $SUBMISSION_PRS; do
              gh pr edit "$PR_NUM" --add-label "Potential Duplicate"
              if [ "$PR_NUM" = "$PR_NUMBER" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
                gh pr comment "$PR_NUM" --body "Multiple open game submissions detected for this author. If this is an update, add it to the existing PR. If these are different games, a reviewer can remove this label."
              fi
            done
          else
            for PR_NUM in $SUBMISSION_PRS; do
              gh pr edit "$PR_NUM" --remove-label "Potential Duplicate" || true
            done
          fi
