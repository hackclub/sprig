name: Sync Sprig Project Board
on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-sheet:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync project board
        run: node .github/scripts/sync-github-project.mjs
        env:
          PROJECT_GITHUB_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_PROJECT_URL: ${{ secrets.GITHUB_PROJECT_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
