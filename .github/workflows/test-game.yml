name: test-game

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
  pull_request:
    paths:
      - 'games/**.js'
      - 'engine/**'
      - 'tests/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  test-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log Environment Information
        run: |
          echo "Run started on: $(date)"
          echo "Runner OS: ${{ runner.os }}"
          echo "Workflow Ref: ${{ github.ref }}"
          echo "Base Ref: ${{ github.base_ref }}"
          echo "Head Ref: ${{ github.head_ref }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            games:
              - 'games/**.js'
            engine:
              - 'engine/**'
              - 'tests/**'
          json: true
          escape_json: false
          safe_output: false

      - name: Log Changed Files
        env:
          CHANGED_GAMES: ${{ steps.changed-files.outputs.games_all_changed_files }}
          ENGINE_CHANGED: ${{ steps.changed-files.outputs.engine_any_changed }}
        run: |
          echo "Changed Games: $CHANGED_GAMES"
          echo "Engine Changed: $ENGINE_CHANGED"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Engine
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: engine

      - name: Check Games
        env:
          GAMES_CHANGED: ${{ steps.changed-files.outputs.games_any_changed }}
          ENGINE_CHANGED: ${{ steps.changed-files.outputs.engine_any_changed }}
          CHANGED_GAMES: ${{ steps.changed-files.outputs.games_all_changed_files }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GAMES_CHANGED" = "true" ] && [ -n "$CHANGED_GAMES" ] && [ "$CHANGED_GAMES" != "[]" ]; then
            mapfile -t files < <(bun -e 'for (const f of JSON.parse(process.env.CHANGED_GAMES)) console.log(f)')
            bun run tests/sprigfuzzy_workflow.js "${files[@]}"
          elif [ "$ENGINE_CHANGED" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Running all games (engine/tests changed or workflow_dispatch)"
            bun run tests/sprigfuzzy_workflow.js
          else
            echo "No game or engine files changed, skipping"
          fi
