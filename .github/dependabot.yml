version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
          - "y-codemirror.next"

  - package-ecosystem: "npm"
    directory: "/engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/yjs-client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/yjs-signaling-server"
    schedule:
      interval: "weekly"